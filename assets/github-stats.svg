<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
<defs>
 <linearGradient id="g" x1="0" x2="1"><stop stop-color="#00d9ff"/><stop offset="1" stop-color="#9d5cff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="760" height="300" rx="18" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="758" height="298" rx="17" fill="none" stroke="url(#g)" opacity=".35"/>
<text x="34" y="43" fill="#00d9ff" font-family="Arial,sans-serif" font-size="22" font-weight="700">WaseJS · GitHub Statistics</text>
<text x="34" y="67" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">Live profile data · animated status</text>
<g font-family="Arial,sans-serif">
 <rect x="34" y="88" width="214" height="82" rx="12" fill="#161b22" stroke="#30363d"/>
 <text x="54" y="115" fill="#8b949e" font-size="11">CONTRIBUTIONS</text><text x="54" y="151" fill="#e6edf3" font-size="29" font-weight="700">17</text>
 <rect x="273" y="88" width="214" height="82" rx="12" fill="#161b22" stroke="#30363d"/>
 <text x="293" y="115" fill="#8b949e" font-size="11">PUBLIC REPOS</text><text x="293" y="151" fill="#e6edf3" font-size="29" font-weight="700">1</text>
 <rect x="512" y="88" width="214" height="82" rx="12" fill="#161b22" stroke="#30363d"/>
 <text x="532" y="115" fill="#8b949e" font-size="11">STARS</text><text x="532" y="151" fill="#e6edf3" font-size="29" font-weight="700">0</text>
 <rect x="34" y="190" width="333" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
 <text x="54" y="216" fill="#8b949e" font-size="11">ACTIVITY</text><text x="54" y="244" fill="#00d9ff" font-size="19" font-weight="700">ACTIVE · BUILDING</text>
 <circle cx="326" cy="232" r="7" fill="#39d353" filter="url(#glow)"><animate attributeName="r" values="6;10;6" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.35;1" dur="1.4s" repeatCount="indefinite"/></circle>
 <rect x="393" y="190" width="333" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
 <text x="413" y="216" fill="#8b949e" font-size="11">SYSTEM</text><text x="413" y="244" fill="#9d5cff" font-size="19" font-weight="700">ONLINE · READY</text>
 <circle cx="697" cy="232" r="5" fill="#9d5cff"><animate attributeName="opacity" values=".2;1;.2" dur="1.1s" repeatCount="indefinite"/></circle>
</g>
<rect x="34" y="276" width="692" height="2" rx="1" fill="#21262d"/>
<rect x="34" y="276" width="140" height="2" rx="1" fill="url(#g)"><animate attributeName="x" values="34;586;34" dur="3s" repeatCount="indefinite"/></rect>
