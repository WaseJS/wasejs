<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#15102a"/></linearGradient>
 <linearGradient id="snake" x1="0" x2="1"><stop stop-color="#00d9ff"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#b44cff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="foodGlow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#242938" stroke-width="1"/></pattern>
 <path id="route" d="M100 100 H760 V250 H100 V100 H420 V160 H700" fill="none"/>
</defs>

<rect width="900" height="330" rx="22" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

<text x="30" y="38" fill="#00d9ff" font-family="monospace" font-size="21" font-weight="700">Contribution Snake // GAME MODE</text>
<text x="30" y="60" fill="#8b949e" font-family="monospace" font-size="11">A REAL ANIMATED SNAKE • EAT THE CONTRIBUTION FOOD • KEEP MOVING</text>

<rect x="30" y="78" width="840" height="205" rx="14" fill="#080b12" stroke="#252b38"/>
<rect x="30" y="78" width="840" height="205" rx="14" fill="url(#grid)" opacity=".7"/>

<!-- arena -->
<rect x="55" y="92" width="790" height="177" rx="10" fill="none" stroke="#00d9ff" stroke-opacity=".22"/>

<!-- food -->
<g filter="url(#foodGlow)">
 <circle cx="760" cy="145" r="9" fill="#ff4fd8"><animate attributeName="r" values="7;11;7" dur="1s" repeatCount="indefinite"/></circle>
 <circle cx="760" cy="145" r="4" fill="#fff"/>
</g>
<text x="778" y="149" fill="#ff78e3" font-family="monospace" font-size="10">+1</text>

<!-- actual snake body -->
<g fill="url(#snake)" stroke="#0b1020" stroke-width="3" filter="url(#glow)">
 <circle r="15"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
 <circle r="14"><animateMotion dur="7s" begin="-.18s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
 <circle r="13"><animateMotion dur="7s" begin="-.36s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
 <circle r="12"><animateMotion dur="7s" begin="-.54s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
 <circle r="11"><animateMotion dur="7s" begin="-.72s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
 <circle r="10"><animateMotion dur="7s" begin="-.90s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
 <circle r="9"><animateMotion dur="7s" begin="-1.08s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
 <circle r="8"><animateMotion dur="7s" begin="-1.26s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
 <circle r="7"><animateMotion dur="7s" begin="-1.44s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
</g>

<!-- animated head with eyes -->
<g>
 <circle r="16" fill="#00d9ff" stroke="#08101c" stroke-width="3" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
 <g fill="#fff">
  <circle cx="-5" cy="-5" r="3"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
  <circle cx="5" cy="-5" r="3"><animateMotion dur="7s" begin="-.01s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
 </g>
</g>

<!-- score HUD -->
<g font-family="monospace">
 <rect x="55" y="99" width="150" height="42" rx="9" fill="#0d1117" stroke="#30363d"/>
 <text x="70" y="116" fill="#8b949e" font-size="9">SCORE</text>
 <text x="70" y="133" fill="#00d9ff" font-size="15" font-weight="700">017</text>
 <rect x="215" y="99" width="150" height="42" rx="9" fill="#0d1117" stroke="#30363d"/>
 <text x="230" y="116" fill="#8b949e" font-size="9">LENGTH</text>
 <text x="230" y="133" fill="#9d5cff" font-size="15" font-weight="700">009</text>
 <rect x="375" y="99" width="150" height="42" rx="9" fill="#0d1117" stroke="#30363d"/>
 <text x="390" y="116" fill="#8b949e" font-size="9">SPEED</text>
 <text x="390" y="133" fill="#39d353" font-size="15" font-weight="700">FAST</text>
</g>

<text x="55" y="307" fill="#8b949e" font-family="monospace" font-size="11">● SNAKE ONLINE</text>
<text x="205" y="307" fill="#6e7681" font-family="monospace" font-size="11">HEAD → BODY → FOOD → REPEAT</text>
<circle cx="840" cy="304" r="6" fill="#39d353"><animate attributeName="r" values="5;9;5" dur="1.2s" repeatCount="indefinite"/></circle>
</svg>