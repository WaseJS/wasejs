name: Generate Contribution Snake Game

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate real contribution snake game
        uses: Platane/snk@v3
        with:
          github_user_name: WaseJS
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=%2300D9FF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%239D5CFF
            dist/github-snake.gif?color_snake=%2300D9FF&color_dots=%230D1117%2C%23161B22%2C%2300D9FF%2C%237C3AED%2C%23FFFFFF&color_background=%230D1117

      - name: Publish generated snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
